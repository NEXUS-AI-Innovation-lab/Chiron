services:
  # --- Database ---
  postgres:
    image: postgres:15
    container_name: p6_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: p6_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- Stockage objet des lames (Garage, compatible S3) ---
  # Remplace MinIO. Configuration : garage/garage.toml. Les secrets ci-dessous
  # sont des valeurs de DÉVELOPPEMENT, à remplacer en déploiement.
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: p6_garage
    hostname: garage
    ports:
      - "3900:3900"   # API S3 (celle qu'utilisent le backend et le seeder)
      - "3903:3903"   # API d'administration (jeton GARAGE_ADMIN_TOKEN)
    environment:
      GARAGE_RPC_SECRET: acc5b7176114a07717dfc817f4e2fea4f449567b5437f75fd5a5f7f593e247eb
      GARAGE_ADMIN_TOKEN: e9fa5a405b6f343b8f6db6fdd3043cd75e2f07997317e9c1
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - app_network

  # --- Initialisation de Garage (s'exécute puis s'arrête) ---
  # Un Garage neuf n'a ni disposition, ni clé, ni bucket : ce conteneur les
  # crée (idempotent), avant que le backend et le seeder démarrent.
  garage_init:
    image: python:3.12-alpine
    container_name: p6_garage_init
    command: python /garage/init_garage.py
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: e9fa5a405b6f343b8f6db6fdd3043cd75e2f07997317e9c1
      S3_ACCESS_KEY: GK7f5b9f737e5d1f5b2d907639
      S3_SECRET_KEY: baa7d18ca1d495315d4bf859e05dd3a3f2898ccff58f634c7f309f1764c47939
      S3_BUCKET: biopsie
    volumes:
      - ./garage:/garage:ro
    depends_on:
      - garage
    networks:
      - app_network

  # --- PACS Radiologie (Orthanc) ---
  orthanc:
    image: jodogne/orthanc-plugins:1.12.0
    container_name: p6_orthanc
    ports:
      - "8042:8042"
      - "4242:4242"
    environment:
      - ORTHANC_NAME=Chiron PACS Radiologie
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    networks:
      - app_network

  # --- Backend (Python/FastAPI) ---
  backend:
    build: ./backend
    container_name: p6_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    volumes:
      - ./backend:/app
      - ./backend/dzi_data:/app/dzi_data 
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://user:password@p6_postgres:5432/p6_db
      - S3_ENDPOINT=http://garage:3900
      - S3_REGION=garage
      - S3_ACCESS_KEY=GK7f5b9f737e5d1f5b2d907639
      - S3_SECRET_KEY=baa7d18ca1d495315d4bf859e05dd3a3f2898ccff58f634c7f309f1764c47939
      - S3_BUCKET=biopsie
    depends_on:
      postgres:
        condition: service_started
      # Attend que la clé et le bucket existent dans Garage.
      garage_init:
        condition: service_completed_successfully
    networks:
      - app_network

  # --- InstanSeg (Instance Segmentation API) ---
  instanseg:
    build: ./instanseg
    container_name: p6_instanseg
    ports:
      # 7000 cote hote est pris par le recepteur AirPlay de macOS (ControlCenter).
      # Le port interne reste 7000 : le backend joint le service via http://instanseg:7000.
      - "7001:7000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- Frontend (React/Vite) ---
  frontend:
    build: ./frontend
    container_name: p6_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8002
      # Service externe OLGA (formulaires du workflow). Résolu par le
      # NAVIGATEUR, pas par le conteneur : d'où localhost et non un nom de
      # service Docker. OLGA vit dans sa propre stack (olga-designer-admin-backend).
      - VITE_OLGA_API_URL=http://localhost:9091
    networks:
      - app_network

  # --- Auto-Injection des Images ---
  image_seeder:
    build: ./backend
    container_name: p6_image_seeder
    command: python seed_images.py
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://user:password@p6_postgres:5432/p6_db
      - S3_ENDPOINT=http://garage:3900
      - S3_REGION=garage
      - S3_ACCESS_KEY=GK7f5b9f737e5d1f5b2d907639
      - S3_SECRET_KEY=baa7d18ca1d495315d4bf859e05dd3a3f2898ccff58f634c7f309f1764c47939
      - S3_BUCKET=biopsie
    depends_on:
      backend:
        condition: service_started
      orthanc:
        condition: service_started
      garage_init:
        condition: service_completed_successfully
    networks:
      - app_network

volumes:
  postgres_data:
  # Ancien volume MinIO : plus utilisé par la pile, conservé pour pouvoir
  # migrer ses objets vers Garage (voir docs/15-stockage-garage.md).
  minio_data:
  garage_meta:
  garage_data:
  orthanc_data:

networks:
  app_network:
    driver: bridge